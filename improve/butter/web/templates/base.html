<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light dark">
<title>{{ v.title }} · Butter</title>
{% block head %}{% endblock %}
<style>
:root {
  --bg-light: #fbfaf7; --bg-dark: #17171a;
  --surface-light: #ffffff; --surface-dark: #212125;
  --text-light: #1d1d21; --text-dark: #ececf0;
  --muted-light: #5a5a66; --muted-dark: #a3a3b0;
  --line-light: #d9d6cf; --line-dark: #3a3a42;
  --accent-light: #8a5a00; --accent-dark: #f0c35c;
  --ok-light: #1b6b3a; --ok-dark: #7fd6a0;
  --warn-light: #8a4b00; --warn-dark: #f2b56b;
  --bad-light: #a32222; --bad-dark: #ff9a9a;
  --bg: var(--bg-light); --surface: var(--surface-light); --text: var(--text-light); --muted: var(--muted-light);
  --line: var(--line-light); --accent: var(--accent-light); --ok: var(--ok-light); --warn: var(--warn-light);
  --bad: var(--bad-light);
  @media (prefers-color-scheme: dark) {
    --bg: var(--bg-dark); --surface: var(--surface-dark); --text: var(--text-dark); --muted: var(--muted-dark);
    --line: var(--line-dark); --accent: var(--accent-dark); --ok: var(--ok-dark); --warn: var(--warn-dark);
    --bad: var(--bad-dark);
  }
  color-scheme: light dark;
  accent-color: var(--accent);
}
* { box-sizing: border-box; }
body { margin: 0; background: var(--bg); color: var(--text); line-height: 1.6;
  font-family: system-ui, "Segoe UI", "Microsoft YaHei", "PingFang SC", sans-serif; font-size: 1rem; }
header.site { border-block-end: 1px solid var(--line); background: var(--surface); }
header.site nav, main { max-inline-size: 68rem; margin-inline: auto; padding-inline: 1rem; }
header.site nav { display: flex; flex-wrap: wrap; gap: .25rem 1.25rem; align-items: baseline; padding-block: .75rem; }
header.site .brand { font-weight: 700; font-size: 1.15rem; }
header.site a[aria-current="page"] { font-weight: 700; text-decoration-thickness: 2px; }
main { padding-block: 1.5rem 4rem; }
a { color: var(--accent); }
a:focus-visible, button:focus-visible, input:focus-visible, textarea:focus-visible, summary:focus-visible,
.table-wrap:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
h1 { font-size: 1.6rem; margin-block: 0 .5rem; text-wrap: balance; }
h2 { font-size: 1.2rem; margin-block: 2rem .5rem; }
h3 { font-size: 1rem; margin-block: 1.25rem .25rem; }
p { margin-block: .5rem; max-inline-size: 46rem; }
.muted { color: var(--muted); }
.card { background: var(--surface); border: 1px solid var(--line); border-radius: .5rem; padding: 1rem; margin-block: 1rem; }
.row { display: flex; flex-wrap: wrap; gap: .5rem 1.5rem; align-items: baseline; }
.chip { display: inline-block; border: 1px solid currentColor; border-radius: 999px; padding: 0 .6rem; font-size: .85rem;
  white-space: nowrap; }
.chip.ok { color: var(--ok); } .chip.warn { color: var(--warn); } .chip.bad { color: var(--bad); } .chip.plain { color: var(--muted); }
.table-wrap { overflow: auto; max-inline-size: 100%; border: 1px solid var(--line); border-radius: .5rem; background: var(--surface); }
table { border-collapse: collapse; inline-size: 100%; }
caption { text-align: start; padding: .5rem .75rem; font-weight: 600; }
th, td { text-align: start; vertical-align: top; padding: .5rem .75rem; border-block-start: 1px solid var(--line); }
thead th { background: var(--surface); color: var(--muted); font-weight: 600; font-size: .9rem; white-space: nowrap; }
td.num, th.num { text-align: end; font-variant-numeric: tabular-nums; }
.wrap { overflow-wrap: anywhere; }
td:last-child > a { white-space: nowrap; }
.before-after { display: grid; gap: .5rem; grid-template-columns: repeat(auto-fit, minmax(16rem, 1fr)); margin-block: .5rem; }
.before-after > div { border: 1px solid var(--line); border-radius: .375rem; padding: .5rem .75rem; }
.before-after .label { font-size: .85rem; color: var(--muted); }
details { margin-block: .5rem; }
summary { cursor: pointer; padding-block: .25rem; }
form .field { display: flex; flex-direction: column; align-items: flex-start; gap: .25rem; margin-block-end: 1.25rem; }
form label { font-weight: 600; }
form .hint { color: var(--muted); font-size: .9rem; }
input[type="text"], input[type="date"], textarea { font: inherit; font-size: max(1rem, 1em); padding: .6rem .75rem; min-block-size: 2.75rem;
  border: 1px solid var(--muted); border-radius: .375rem; background: var(--surface); color: var(--text);
  inline-size: min(100%, 40rem); }
input[type="date"] { inline-size: auto; }
textarea { min-block-size: 5rem; }
fieldset { border: 1px solid var(--line); border-radius: .5rem; padding: .75rem 1rem; margin-block: 1rem; margin-inline: 0; }
legend { font-weight: 600; padding-inline: .5rem; }
.choice { display: flex; gap: .5rem; align-items: baseline; padding-block: .25rem; }
.choice input[type="checkbox"], .choice input[type="radio"] { inline-size: 1.15rem; block-size: 1.15rem; flex: none; }
.qrow { display: grid; grid-template-columns: auto 1fr; gap: .25rem .6rem; align-items: start; padding-block: .5rem;
  border-block-start: 1px solid var(--line); }
.qrow input[type="text"] { inline-size: 100%; }
.qrow .meta { grid-column: 2; font-size: .85rem; color: var(--muted); }
button { font: inherit; font-size: 1rem; padding: .6rem 1.1rem; min-block-size: 2.75rem; border-radius: .375rem; cursor: pointer;
  border: 1px solid var(--accent); background: var(--accent); color: var(--bg); font-weight: 600; }
button.secondary { background: transparent; color: var(--accent); }
.notice { border-inline-start: 4px solid var(--accent); padding: .5rem .75rem; background: var(--surface); margin-block: 1rem; }
table.bars td:last-child { inline-size: 35%; min-inline-size: 8rem; }
.bar { display: block; block-size: .8rem; min-inline-size: 2px; background: var(--accent); border-radius: .25rem; }
.visually-hidden { position: absolute; clip-path: inset(50%); overflow: hidden; width: 1px; height: 1px; margin: -1px;
  padding: 0; border: 0; white-space: nowrap; }
code { font-family: ui-monospace, Consolas, monospace; font-size: .9em; overflow-wrap: anywhere; }
footer.site { max-inline-size: 68rem; margin-inline: auto; padding: 1rem; color: var(--muted); font-size: .85rem;
  border-block-start: 1px solid var(--line); }
</style>
</head>
<body>
<header class="site">
  <nav aria-label="主导航">
    <span class="brand">Butter</span>
    {% if static %}
    <a href="/"{% if path == "/" %} aria-current="page"{% endif %}>展示页</a>
    <a href="/registry"{% if path.startswith("/registry") %} aria-current="page"{% endif %}>证据表</a>
    {% else %}
    <a href="/"{% if path == "/" %} aria-current="page"{% endif %}>首页</a>
    <a href="/batches"{% if path.startswith("/batches") %} aria-current="page"{% endif %}>改动批次</a>
    <a href="/registry"{% if path.startswith("/registry") %} aria-current="page"{% endif %}>证据表</a>
    <a href="/settings"{% if path.startswith("/settings") %} aria-current="page"{% endif %}>设置</a>
    {% endif %}
  </nav>
</header>
<main>
{% block main %}{% endblock %}
</main>
<footer class="site">
  Butter {{ version }}。这里的结果只代表这一次测到的情况。变了，不等于是这次改动造成的。
  <a href="{{ path if path != '/' else '/index' }}.json">这一页的数据(JSON）</a>
</footer>
</body>
</html>
