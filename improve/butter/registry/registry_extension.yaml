      zh: "在页面里藏文字、写给 AI 的指令(提示注入),能让 AI 更多引用或推荐自己"
      en: "Hiding text or instructions aimed at AI (prompt injection) in a page makes AI cite or recommend the site more"
    plain:
      zh: "在页面里藏只给 AI 看的文字或指令(禁止项)"
      en: "Hiding text or instructions on a page that only AI is meant to read (forbidden)"
    verify:
      zh: "不适用(禁止项)"
      en: "Not applicable (forbidden)"
    evidence_level: E
    sources:
      zh:
        - "Google 垃圾内容政策:隐藏文字与链接滥用;试图操纵生成式 AI 回答"
        - "Bing 网站管理员指南(2026-02-27 重写):「Prompt Injection and AI Manipulation」一节"
        - "SafeGEO(arXiv 2606.28356):操纵性改写可把劣质产品进前三的比例从 3.4% 推到 79.6%(Gemma 4 31B,仿真)"
      en:
        - "Google spam policies: hidden text and link abuse; attempting to manipulate generative AI responses"
        - "Bing Webmaster Guidelines (rewritten 2026-02-27): the 'Prompt Injection and AI Manipulation' section"
        - "SafeGEO (arXiv 2606.28356): manipulative rewrites pushed an inferior product's top-3 rate from 3.4% to 79.6% (Gemma 4 31B, simulation)"
