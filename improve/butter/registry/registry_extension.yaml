      en: "Forbidden; must never be recommended. The checker uses this entry to block hidden text and instructions aimed at AI"
    version: 1

  # ── REPRESENTATION ──────────────────────────────────────────────────
  - id: EVIDENCE_JSONLD_BODY_CONSISTENCY_V1
    stage: REPRESENTATION
    kind: technical_fix
    hypothesis:
      zh: "结构化数据(JSON-LD)里的价格、库存、评分、名称要和页面上看得见的内容一致,也不能标页面上没有的内容。不一致违反 Google 的结构化数据政策;而且 ChatGPT-User、Claude-User、Gemini 直接抓页面时不读 JSON-LD,事实还得写在看得见的正文里"
      en: "Price, availability, ratings and names in structured data (JSON-LD) must match what is visible on the page, and nothing may be marked up that the page does not show. Mismatches violate Google's structured data policies; and ChatGPT-User, Claude-User and Gemini do not read JSON-LD when they fetch a page directly, so the facts must also be in the visible text"
    plain:
      zh: "JSON-LD 里写的价格、库存等要和页面上显示的一样;页面上没有的,不要写进 JSON-LD"
      en: "Make sure the price, stock and other values in your JSON-LD match what the page shows; do not put anything in JSON-LD that the page itself does not show"
    verify:
      zh: "改完后重新审计一次,看「JSON-LD 与正文不一致」是否清零;也可以用 Google 的富媒体搜索结果测试检查标记"
      en: "Re-run the audit and check that no JSON-LD mismatch is left; Google's Rich Results Test can also check the markup"
    evidence_level: A
    sources:
      zh:
        - "Google 搜索中心结构化数据通用指南:不要标注读者看不到的内容;结构化数据必须真实反映页面内容;不得标注虚假评论"
        - "Resoneo 实测:ChatGPT-User、Claude-User、Gemini 直接抓取时不解析 JSON-LD(代理公司)"
        - "DiD 研究:给页面加 schema 没有提高 AI 引用(AI Overviews −4.6%,AI Mode、ChatGPT 不显著;research/02 Q1-16)"
      en:
        - "Google Search Central general structured data guidelines: don't mark up content that is not visible to readers; structured data must be a true representation of the page content; no fake reviews"
        - "Resoneo tests: ChatGPT-User, Claude-User and Gemini do not parse JSON-LD when fetching directly (agency)"
        - "DiD study: adding schema did not raise AI citations (AI Overviews −4.6%; AI Mode and ChatGPT not significant; research/02 Q1-16)"
    supported_intents: [category_discovery, problem_solution, comparison_alternative, recommendation, brand_fact]
    contraindications:
      zh: []
      en: []
    engines_tested:
      - "官方文档口径"
    expected_effect: 一致性要求,不承诺引用
    guardrail:
      zh: "JSON-LD 不当作引用杠杆,只为与正文一致、帮助认出实体"
      en: "JSON-LD is not a citation lever; it is there to stay consistent with the page and help identify the entity"
    version: 1

  # ── ACCESS ──────────────────────────────────────────────────────────
  - id: EVIDENCE_ACCESS_META_SNIPPET_V1
    stage: ACCESS
    kind: technical_fix
    access_checks: []  # Toast 现有的 10 个检查里没有 meta robots,只能留空;并进 Toast 时要配一个检查项(提案文档写)
    hypothesis:
      zh: "目标页不能带 noindex、nosnippet、NOARCHIVE;max-snippet、data-nosnippet、NOCACHE 会限制内容被 AI 回答直接使用,要慎用"
      en: "Target pages must not carry noindex, nosnippet or NOARCHIVE; max-snippet, data-nosnippet and NOCACHE limit how content can be used directly in AI answers and should be used with care"
    plain:
      zh: "检查页面上的 robots 元标签:noindex、nosnippet、NOARCHIVE 会让 AI 回答用不了你的内容"
      en: "Check the robots meta tags on your pages: noindex, nosnippet and NOARCHIVE keep AI answers from using your content"
    verify:
      zh: "改完后重新检测一次,确认这些标签已经去掉;Google Search Console 的网址检查能看到 Google 读到的结果"
      en: "Re-run the check and confirm the tags are gone; URL Inspection in Google Search Console shows what Google reads"
    evidence_level: A
    sources:
      zh:
        - "Google 搜索中心(robots meta 标签):nosnippet 也会阻止内容被 AI Overviews 和 AI Mode 直接使用;max-snippet 同样限制可用的长度"
        - "Bing:标了 NOARCHIVE 的内容不进 Bing Chat 回答(2023,经 SER 转述)"
      en:
        - "Google Search Central (robots meta tag): nosnippet also prevents the content from being used as a direct input for AI Overviews and AI Mode; max-snippet limits it likewise"
        - "Bing: content tagged NOARCHIVE is not included in Bing Chat answers (2023, as reported by SER)"
    supported_intents: [category_discovery, problem_solution, comparison_alternative, recommendation, brand_fact]
    contraindications:
      zh:
        - "有意不让内容出现在 AI 回答里的页面"
      en:
        - "Pages whose owners deliberately keep them out of AI answers"
    engines_tested:
      - "官方文档口径"
    expected_effect: 必要非充分条件
    guardrail:
      zh: "去掉限制只解决准入,不构成任何排名或引用承诺"
      en: "Removing the restriction only solves admission; it promises no ranking or citations"
    version: 1

  - id: EVIDENCE_ACCESS_USER_FETCHER_SSR_V1
    stage: ACCESS
    kind: technical_fix
    # 与 Toast 的 EVIDENCE_ACCESS_SSR_V1 有重叠:那条讲渲染,这条补用户触发抓取器的官方口径。并进 Toast 时合并还是并列,提案文档里写。
    access_checks: [html_content]
    hypothesis:
      zh: "用户触发的 AI 抓取器(如 ChatGPT-User、Perplexity-User)不一定遵守 robots.txt,多数也不执行 JavaScript,所以主内容要在第一次返回的 HTML 里"
      en: "User-triggered AI fetchers (such as ChatGPT-User and Perplexity-User) may not follow robots.txt, and most do not execute JavaScript, so the main content must be in the first HTML response"
    plain:
      zh: "AI 替用户临时打开你的页面时,通常不跑 JavaScript;主要内容要在网页源代码里直接能看到"
      en: "When an AI opens your page on a user's behalf it usually does not run JavaScript; the main content must be visible in the page source itself"
    verify:
      zh: "关掉 JavaScript 打开页面,或者看网页源代码,确认主要内容、价格和规格都在里面"
      en: "Open the page with JavaScript turned off, or view the page source, and confirm the main content, prices and specs are there"
    evidence_level: A
    sources:
      zh:
        - "OpenAI、Perplexity、Meta、Amazon、Kimi 的官方爬虫文档:用户触发的抓取器可能不遵守 robots.txt"
        - "Resoneo 实测:ChatGPT-User、Claude-User、Gemini、Perplexity-User 不执行 JavaScript(代理公司)"
        - "横截面:92.5% 的被引页主内容不依赖 JavaScript(厂商)"
      en:
        - "Official crawler documentation from OpenAI, Perplexity, Meta, Amazon and Kimi: user-triggered fetchers may not follow robots.txt"
        - "Resoneo tests: ChatGPT-User, Claude-User, Gemini and Perplexity-User do not execute JavaScript (agency)"
        - "Cross-section: 92.5% of cited pages do not need JavaScript for their main content (vendor)"
    supported_intents: [category_discovery, problem_solution, comparison_alternative, recommendation, brand_fact]
    contraindications:
      zh:
        - "页面本来就是服务端渲染或静态的(不用改)"
      en:
        - "Pages that are already server-rendered or static (nothing to change)"
    engines_tested:
      - "官方文档口径"
      - "chatgpt-user"
      - "claude-user"
      - "gemini"
      - "perplexity-user"
    expected_effect: 必要非充分条件
    guardrail:
      zh: "只解决能不能读到,不构成任何排名或引用承诺"
      en: "This only makes the content readable; it promises no ranking or citations"
    version: 1
