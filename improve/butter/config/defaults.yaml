    source: "Potato 接入 Grok 时的真机试打(providers/grok.py 注释):grok-4.3 一次实际 $0.048。只有 1 次,等 Butter 真测过再换"
    source_plain: "Potato 2026 年 11 月试打过 1 次:问一次大约花这么多。次数太少,只能当参考"
