    user_agent_checked: verbatim
    purpose: search_index
    robots_stance: 页面未说明
    docs_url: https://docs.mistral.ai/robots
    checked_on: "2026-11-11"
    checked_how: 当日打开读到正文
    note: 页面称它只为索引抓取,内容不用于生成式 AI 训练
  - vendor: Mistral
    name: MistralAI-Training
    robots_token: MistralAI-Training
    user_agent: "Mozilla/5.0 AppleWebKit/537.36 (KHTML, like Gecko; compatible; MistralAI-Training/1.0; +https://docs.mistral.ai/robots)"
    user_agent_checked: verbatim
    purpose: training
    robots_stance: 页面没有明说遵守;说站长可以在 robots.txt 里 disallow 它
    docs_url: https://docs.mistral.ai/robots
    checked_on: "2026-11-11"
    checked_how: 当日打开读到正文
  - vendor: Mistral
    name: MistralAI-User
    robots_token: MistralAI-User
    user_agent: "Mozilla/5.0 AppleWebKit/537.36 (KHTML, like Gecko; compatible; MistralAI-User/1.0; +https://docs.mistral.ai/robots)"
    user_agent_checked: verbatim
    purpose: user_fetch
    robots_stance: 页面未说明
    docs_url: https://docs.mistral.ai/robots
    checked_on: "2026-11-11"
    checked_how: 当日打开读到正文

  # ── Kimi(月之暗面):国内唯一有官方爬虫文档的厂商 ──
  - vendor: Kimi(月之暗面)
    name: Kimi-SearchBot
    robots_token: Kimi-SearchBot
    user_agent: "Mozilla/5.0 AppleWebKit/537.36 (KHTML, like Gecko); compatible; Kimi-SearchBot/1.0; +https://www.kimi.com/policies/kimi-crawlers"
    user_agent_checked: stitched
    purpose: search_index
    robots_stance: 页面称使用业界标准的 robots.txt 指令;disallow 它会让网站不出现在 Kimi 搜索结果里
    docs_url: https://www.kimi.ai/policies/kimi-crawlers
    checked_on: "2026-11-11"
    checked_how: 当日打开读到正文(kimi.com 的同路径 302 跳到此地址)
    note: 页面要求按子域分别放 robots.txt(每个子域算一个独立来源)
  - vendor: Kimi(月之暗面)
    name: KimiBot
    robots_token: KimiBot
    user_agent: "Mozilla/5.0 AppleWebKit/537.36 (KHTML, like Gecko); compatible; KimiBot/1.0; +https://www.kimi.com/policies/kimi-crawlers"
    user_agent_checked: stitched
    purpose: training
    robots_stance: 页面称使用业界标准的 robots.txt 指令;disallow 它表示内容不应用于模型训练
    docs_url: https://www.kimi.ai/policies/kimi-crawlers
    checked_on: "2026-11-11"
    checked_how: 当日打开读到正文(kimi.com 的同路径 302 跳到此地址)
  - vendor: Kimi(月之暗面)
    name: Kimi-User
    robots_token: Kimi-User
    user_agent: "Mozilla/5.0 AppleWebKit/537.36 (KHTML, like Gecko); compatible; Kimi-User/1.0; +https://www.kimi.com/policies/kimi-crawlers"
    user_agent_checked: stitched
    purpose: user_fetch
    robots_stance: 操作由用户触发,robots.txt 规则可能不直接适用
    docs_url: https://www.kimi.ai/policies/kimi-crawlers
    checked_on: "2026-11-11"
    checked_how: 当日打开读到正文(kimi.com 的同路径 302 跳到此地址)
