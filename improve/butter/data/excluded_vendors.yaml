# 所以不进表;Butter 也不采用第三方名单里用途不明的 UA。厂商发布官方文档后即可纳入。
#
# checked_on 是调研 / 核验当天的日期,不是今天:这张表本周没有重新逐家核对,只是把已有的调研结论落成数据。
