[project]
name = "butter-geo"
version = "0.2.0"
description = "Butter (FatCat GEO Improve): fact base, audit, change package and before/after measurement for one site."
requires-python = ">=3.12"
# 版本由仓库根的那一份 uv.lock 钉死;这里只写下限。
# (单独一个项目时这里逐个钉死过;放进同一个环境后,钉死的版本会和别的部分要的范围对不上。)
dependencies = [
    "httpx>=0.28.1",
    "beautifulsoup4>=4.15.0",
    "lxml>=6.1.1",
    "pydantic>=2.13.5",
    "PyYAML>=6.0.3",
    "Jinja2>=3.1.6",
    "fastapi>=0.165.0",
    "uvicorn>=0.54.0",
    "python-multipart>=0.0.34",
]

[project.optional-dependencies]
dev = ["pytest>=9.1.1"]

[project.scripts]
butter = "butter.cli:main"

[tool.setuptools.packages.find]
include = ["butter*"]

[tool.setuptools.package-data]
butter = ["data/*.yaml", "data/*.json", "registry/*.yaml", "registry/toast_snapshot/*.yaml",
          "config/*.yaml", "web/templates/*.html"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
