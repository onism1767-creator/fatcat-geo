[project]
name = "geo-tool"
version = "0.1.0"
description = "轻量级 AI 可见度诊断:定位品牌在 AI 回答链路中缺席的阶段"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.111",
    "httpx>=0.27",
    "jinja2>=3.1",
    "psycopg[binary]>=3.2",
    "pydantic>=2.7",
    "python-multipart>=0.0.9",
    "pyyaml>=6",
    "scipy>=1.12",
    "structlog>=24",
    "uvicorn>=0.30",
]

[dependency-groups]
dev = [
    "hypothesis>=6",
    "pytest>=8",
    "respx>=0.21",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
