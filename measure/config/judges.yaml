# 高档 AI 裁判(S9.3;架构书附录 v0.4.27 第 4 节 + 用户 2026-10-14 拍板):另一家 AI 读上下文判「提到你」,顺带判态度。
# 主裁判 = 最便宜够用的型号;被测回答出自裁判自家时换备用裁判(另一家);两家都是自家 → 这条「裁判看不到」,不猜。
# 厂商名只许出现在本文件与 adapters/。裁判不联网(search_disabled),只看回答文本与品牌卡;费用进辅助调用账本(task=裁判)。
# est_cost_per_call_usd:推导上界——一条回答约 1,500 输入 token + 150 输出 token,按型号价目算后留余量;价目核对 2026-10-20。
primary:
  surface: openai_web_search
  model: gpt-6-luna                # $0.10 / $0.50 per MTok → 约 $0.0003 / 条,写 0.001 留余量
  est_cost_per_call_usd: 0.001
backup:
  surface: claude_web_search
  model: claude-haiku-5-5          # $0.10 / $0.50 per MTok,同上
  est_cost_per_call_usd: 0.001
