# AI 裁判候选名单(S9.3;BR6):AI 裁判读上下文判「提到你」,顺带判态度。排在前面的优先。
# 开跑时只留下有 key、型号可用、能不联网调用的;每条回答挑第一位「和写这条回答的不是同一家」的
# (按实际写字的那一家认:Perplexity 的 low 预设背后是 OpenAI 的型号,由适配器在 made_by 里声明);
# 都是同一家就照样请排最前的那位判,判定行记下,报告提醒一句「判别用的是写它的同一家 AI,存在判得偏宽的风险」
# (用户 2026-11-17 定:很多用户只填一家的 key,照样判,不因为请不到别家就记说不准;取代 10-29 的「别家都请不到才自家判自家」)。
# 四家各自都能单独当裁判(tests/unit/test_judge.py 把守);名单里一位都用不上 → 这单没有裁判,判不清的记说不准。
# 厂商名只许出现在本文件与 adapters/。裁判不联网(search_disabled),只看回答文本与品牌卡;费用进辅助调用账本(task=裁判)。
# name:确认页说「再加一家 XX 的 key 就能判」用的名字。
# est_cost_per_call_usd:推导上界——一条回答约 1,500 输入 token + 150 输出 token,按型号价目算后留余量。
# 2026-10-21 真实冒烟:短回答每条 $0.00006–0.00011、2–4 秒;长回答按 1,500 输入 token 推导 ≈ $0.0003 → 写 0.0004。
candidates:
  - name: OpenAI
    surface: openai_web_search
    model: gpt-6-luna              # $0.10 / $0.50 per MTok(官方价目页,核对 2026-10-30)→ 约 $0.0003 / 条,写 0.0004 留余量
    est_cost_per_call_usd: 0.0004
  - name: Anthropic
    surface: claude_web_search
    model: claude-haiku-5-5        # $0.10 / $0.50 per MTok,10 万输入 token 以内(官方价目页,核对 2026-10-30),同上
    est_cost_per_call_usd: 0.0004
  # 排最后:BR6 实测难题误认 21/129,前两家 8/129,见 docs/校准/校准-2026-10-31-BR6-Gemini裁判.md。
  - name: Gemini
    surface: gemini_grounding
    model: gemini-3.1-flash-lite   # $0.25 / $1.50 per MTok(官方价目页,核对 2026-10-30);实测 434 次平均 $0.00055,长回答约 $0.0008
    est_cost_per_call_usd: 0.0008
  # 排最后:只有 Perplexity 一家 key 时才轮到它(用户 2026-11-17 定「只有一家的 key 也照样判」)。
  # 同一个接口直接点名型号、不带预设、不带工具(不联网);型号和第一行是同一个,走的是 Perplexity 的门,没单独校准过。
  # 价目同第一行(Agent API 型号页,核对 2026-11-15)。2026-11-17 真实冒烟 3 条:都没搜、一轮判出,
  # 每条 $0.00013–0.00019(输入 707–943 token)、3–4 秒,费用与牌价对得上;长回答按 1,500 输入 token 推导 ≈ $0.0003 → 写 0.0004。
  - name: Perplexity
    surface: perplexity_agent
    model: openai/gpt-6-luna
    est_cost_per_call_usd: 0.0004
