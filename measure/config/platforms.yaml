# 电商与社交平台清单(官网名单里「官方渠道」的配置资产;产品文档 15.2 D12,架构书附录 v0.4.26 第 3 节)。
#
# 官方渠道 = 品牌在第三方平台上的官方页面(旗舰店、官方账号)。它们挂在平台域名下,不能按注册域名算
# (否则整个 tmall.com 都成了官网),改按「主机名 + 路径前缀」精确匹配、报告里单列。
# 只有主站自己声明(结构化数据 sameAs)或首页直接链接、且主机在本清单上的页面才计入——免得把随手链接的网页当官方渠道。
#
# 新增平台 = 本文件加一条,engine/ 零代码改动。匹配规则:主机名等于 host,或是它的子域(brand.tmall.com 命中 tmall.com)。
# 核对日期:2026-10-13(平台域名按各平台当时的主站域名记,需定期核对)。
#
# kind:marketplace_store 电商店铺 / social_account 社交账号 / app_store 应用商店页 / developer_platform 开发者平台主页

platforms:
  - name: 天猫
    kind: marketplace_store
    hosts: [tmall.com, tmall.hk]
