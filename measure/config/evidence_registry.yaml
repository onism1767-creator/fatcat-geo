# 证据注册表(架构书第 8 章)。人工维护的配置资产,不是代码。
#
# 运行规则:
# - 报告中每条建议必须引用本表条目 ID;表里没有的建议不允许出现(铁律 9);
# - evidence_level:A=官方文档/强共识 B=多研究支持 C=单一研究且有反证
#   D=描述性关联 E=无支持(E 级永不作为建议输出,仅存档);
# - C 级及以下的建议渲染时必须带「建议实验验证」字样;
# - 吸收新研究 = 增改本表条目,零代码改动;
# - v1.1 起展示字段(hypothesis/guardrail/contraindications/sources)为 zh/en 双语;
# - v0.4.14 起每条带 plain(人话版,只换说法不换主张):用户视图读 plain,
#   「为什么这么建议」与审计视图读 hypothesis 原句;
# - v0.4.17 起每条带 verify(做完之后怎么检查效果,人话),报告建议表第二列。
#
# 主要来源:KDD2024(arXiv:2311.09735)、C-SEO-Bench(arXiv:2506.11097)、
# SAGEO-Arena(arXiv:2602.12187)、各平台官方爬虫文档。详见架构书 5.3。

# kind(硬边界 9,2026-10-28 落地):technical_fix = 修网站的技术活,注明出处直接建议;
# geo_method = GEO 优化方法,报告一律写成实验卡(猜想 / 依据 / 怎么验证),不得称有效。
entries:
  # ── ACCESS ──────────────────────────────────────────────────────────
  - id: EVIDENCE_ACCESS_ROBOTS_V1
    stage: ACCESS
    kind: technical_fix
    access_checks: [robots_txt]  # 只在这几项检查 FAIL 时给出(审核 2026-10-27 黄 14)
    hypothesis:
      zh: 在 robots.txt 中放行检索类与用户触发类 AI 爬虫,是进入 AI 检索链路的前提
      en: Allowing retrieval and user-triggered AI crawlers in robots.txt is a precondition for entering AI retrieval pipelines
    plain:
      zh: "在 robots.txt 里允许 AI 搜索类爬虫访问你的网站,这是 AI 能找到你的前提"
      en: "Allow AI search crawlers in your robots.txt — without it, AI search cannot reach your site at all"
    verify:
      zh: "改完后重新检测一次,看「官网抓取情况」有没有变成 🟢;真正确认要看网站后台或日志里官方 AI 爬虫是否访问成功"
      en: "Re-run the check and see whether 'Site crawlability' turns 🟢; the real confirmation is whether official AI crawlers succeed in your server logs"
    evidence_level: A
    sources:
      zh: [各平台官方爬虫文档]
      en: [Official crawler documentation of each platform]
    supported_intents: [category_discovery, recommendation, comparison_alternative, problem_solution, brand_fact]
    contraindications:
      zh: [内容策略上有意屏蔽 AI 使用的站点]
      en: [Sites that deliberately block AI use as a content policy]
    engines_tested: [官方文档口径]
    expected_effect: 必要非充分条件
    guardrail:
      zh: 放行只解决准入,不构成任何排名或引用承诺
      en: Allowing access only solves admission; it promises no ranking or citations
    version: 1

  - id: EVIDENCE_ACCESS_CDN_VERIFY_V1
    stage: ACCESS
    kind: technical_fix
    access_checks: [reachability, path_fetch, ua_differential, waf_evidence]
    hypothesis:
      zh: CDN/WAF 侧按官方 IP 段核验放行真实爬虫,而非按 UA 一刀切封禁
      en: Verify real crawlers by official IP ranges at the CDN/WAF instead of blanket UA blocking
    plain:
      zh: "让网站的安全系统(CDN / 防火墙)按官方 IP 名单放行真实的 AI 爬虫,而不是一刀切拦掉所有机器人"
      en: "Have your CDN / firewall admit real AI crawlers by their official IP lists instead of blocking every bot"
    verify:
      zh: "在 CDN 后台确认官方爬虫的访问不再被拦,再重新检测一次看「官网抓取情况」"
      en: "Confirm in the CDN console that official crawlers are no longer blocked, then re-run the check and look at 'Site crawlability'"
    evidence_level: A
    sources:
      zh: [各平台官方 IP 段文档, 主流 CDN verified-bots 机制文档]
      en: [Official crawler IP-range docs, mainstream CDN verified-bots documentation]
    supported_intents: [category_discovery, recommendation, comparison_alternative, problem_solution, brand_fact]
    contraindications:
      zh: []
      en: []
    engines_tested: [官方文档口径]
    expected_effect: 消除准入层阻断
    guardrail:
      zh: 需在 CDN 后台核验,本工具的 UA 探测无法替代站长侧确认
      en: Verify in the CDN console; this tool's UA probing cannot replace site-owner confirmation
    version: 1

  - id: EVIDENCE_ACCESS_SSR_V1
    stage: ACCESS
    kind: technical_fix
    access_checks: [html_content, rendered_fetch]
    hypothesis:
      zh: 关键内容以服务端渲染/预渲染提供,不依赖客户端 JS 执行
      en: Serve key content via server-side rendering / prerendering rather than client-side JS
    plain:
      zh: "把关键内容直接放在网页 HTML 里,不要只靠浏览器脚本加载,因为多数 AI 爬虫不运行脚本"
      en: "Put key content directly in the page HTML rather than loading it with browser scripts — most AI crawlers do not run scripts"
    verify:
      zh: "用不运行脚本的方式打开页面(比如查看网页源代码),确认正文在里面;再重新检测看「官网抓取情况」"
      en: "Open the page without scripts (e.g. view page source) and confirm the text is there; then re-run the check and look at 'Site crawlability'"
    evidence_level: A
    sources:
      zh: [各平台官方爬虫文档(主流 AI 爬虫不执行 JS)]
      en: [Official crawler docs (mainstream AI crawlers do not execute JS)]
    supported_intents: [category_discovery, recommendation, comparison_alternative, problem_solution, brand_fact]
    contraindications:
      zh: []
      en: []
    engines_tested: [官方文档口径]
    expected_effect: 使正文对不执行 JS 的爬虫可读
    guardrail:
      zh: 对爬虫与对用户的内容必须一致,禁止差异化伪装
      en: Content served to crawlers must match what users see; cloaking is forbidden
    version: 1

  - id: EVIDENCE_ACCESS_SITEMAP_V1
    stage: ACCESS
    kind: technical_fix
    access_checks: [sitemap]
    hypothesis:
      zh: 提供 sitemap 与规范链接可能有助于收录完整性
      en: Providing a sitemap and canonical links may help indexing completeness
    plain:
      zh: "提供网站地图(sitemap)和规范链接,可能帮助 AI 更完整地收录你的页面"
      en: "Provide a sitemap and canonical links; this may help AI index your pages more completely"
    verify:
      zh: "提交后过两周重新检测;这一项只是提示,变化不一定看得出来"
      en: "Re-run the check two weeks after submitting; this item is informational and a change may not be visible"
    evidence_level: D
    sources:
      zh: [传统搜索引擎收录实践的描述性外推]
      en: [Descriptive extrapolation from traditional search-engine indexing practice]
    supported_intents: [category_discovery, recommendation, comparison_alternative, problem_solution, brand_fact]
    contraindications:
      zh: []
      en: []
    engines_tested: []
    expected_effect: unknown_experiment_required
    guardrail:
      zh: 不阻断准入,属提示项
      en: Not an access blocker; informational
    version: 1

  # ── RETRIEVAL ───────────────────────────────────────────────────────
  - id: EVIDENCE_STRUCT_V1
    stage: RETRIEVAL
    kind: geo_method
    hypothesis:
      zh: 标题/heading/schema 等结构信号与目标需求语义对齐,有利于检索阶段存活
      en: Aligning structural signals (title/headings/schema) with the target need helps survival at the retrieval stage
    plain:
      zh: "让页面标题、小标题和结构化标记直接说明这页回答的是什么问题,AI 搜索时更容易把它挑出来"
      en: "Make page titles, headings and structured markup say plainly which question the page answers, so AI search can pick it out"
    verify:
      zh: "改完后等 2–4 周,用同一批问题再测一次,看「AI 搜索时有没有找到你」这一格有没有从 🔴 变 🟡 或 🟢;一次只改一件事再测,才知道是哪个起了作用"
      en: "Wait 2–4 weeks, re-test with the same questions and see whether 'Does the AI find you when it searches' moves from 🔴 to 🟡 or 🟢; change one thing at a time so you know what worked"
    evidence_level: B
    sources:
      zh: [SAGEO-Arena(支持:结构化信息利于检索), C-SEO-Bench(检索位次效应显著)]
      en: ["SAGEO-Arena (supports: structured signals help retrieval)", "C-SEO-Bench (strong retrieval-position effect)"]
    supported_intents: [category_discovery, recommendation, comparison_alternative, problem_solution]
    contraindications:
      zh: [已高度优化的页面继续堆砌, 与页面真实内容不符的标题]
      en: [Further stuffing already-optimized pages, Titles inconsistent with actual page content]
    engines_tested: [benchmark_GE, 完整检索流水线仿真]
    expected_effect: 检索阶段存活率提升(幅度须实验)
    guardrail:
      zh: 只改结构与语义对齐,严禁关键词堆砌(有负效应反证)
      en: Only adjust structure and semantic alignment; keyword stuffing is forbidden (counter-evidence of negative effects)
    version: 1

  - id: EVIDENCE_COVERAGE_PAGE_V1
    stage: RETRIEVAL
    kind: geo_method
    hypothesis:
      zh: 为目标需求创建直接作答的专门页面(提高语义覆盖)可能改善进入候选的概率
      en: Creating dedicated pages that directly answer the target need (better semantic coverage) may improve candidate entry
    plain:
      zh: "为用户真正会问的问题写专门的页面、直接作答,让 AI 搜索时更容易找到你"
      en: "Write dedicated pages that directly answer the questions users actually ask, so AI search is more likely to find you"
    verify:
      zh: "新页面上线 2–4 周后,用同一批问题再测一次,看「AI 搜索时有没有找到你」这一格有没有变好"
      en: "2–4 weeks after the new pages go live, re-test with the same questions and see whether 'Does the AI find you when it searches' improves"
    evidence_level: C
    sources:
      zh: [SAGEO-Arena(间接支持), 传统检索共识(描述性)]
      en: [SAGEO-Arena (indirect support), Traditional IR consensus (descriptive)]
    supported_intents: [category_discovery, recommendation, problem_solution]
    contraindications:
      zh: [大量薄内容页面]
      en: [Mass-producing thin-content pages]
    engines_tested: [benchmark_GE]
    expected_effect: unknown_experiment_required
    guardrail:
      zh: 页面须真实有料,禁止批量生成空壳页
      en: Pages must have real substance; bulk-generating empty shells is forbidden
    version: 1

  - id: EVIDENCE_THIRDPARTY_RETRIEVAL_V1
    stage: RETRIEVAL
    kind: geo_method
    channel: third_party   # 第三方线「搜不到写你的第三方网页」时出(架构书附录 v0.4.24 D9;S6.1 从官网线挪来)
    hypothesis:
      zh: 进入检索存在感高的第三方内容(测评/榜单/对比文)可为品牌获得检索层在场
      en: Getting covered by third-party content with strong retrieval presence (reviews/rankings/comparisons) can earn retrieval-stage presence
    plain:
      zh: "争取出现在 AI 常引用的第三方内容里(测评、榜单、对比文章),借它们进入 AI 的搜索结果"
      en: "Get covered by the third-party content AI tends to cite (reviews, rankings, comparisons) and enter AI search results through them"
    verify:
      zh: "第三方内容发布 2–4 周后,用同一批问题再测一次,看「AI 搜索时有没有找到你」这一格,以及 AI 引用的来源里有没有出现那些第三方页面"
      en: "2–4 weeks after the third-party content is published, re-test with the same questions; watch 'Does the AI find you when it searches' and whether those third-party pages appear among the AI's sources"
    evidence_level: C
    sources:
      zh: [本项目实测观察(检索候选集由第三方内容主导,描述性), C-SEO-Bench(来源位次效应)]
      en: [This project's field observation (candidate sets dominated by third-party content; descriptive), C-SEO-Bench (source-position effect)]
    supported_intents: [category_discovery, recommendation, comparison_alternative]
    contraindications:
      zh: [伪造第三方背书(黑帽,禁止)]
      en: [Faking third-party endorsements (black-hat; forbidden)]
    engines_tested: [perplexity]
    expected_effect: unknown_experiment_required
    guardrail:
      zh: 只可通过真实的公关/内容合作达成,严禁伪造与刷量
      en: Only via genuine PR/content partnerships; fabrication and volume manipulation are forbidden
    version: 1

  # ── CITATION ────────────────────────────────────────────────────────
  - id: EVIDENCE_STATS_V1
    stage: CITATION
    kind: geo_method
    hypothesis:
      zh: 增加可核验的量化证据可能提高生成阶段被引用概率
      en: Adding verifiable quantitative evidence may increase citation probability at the generation stage
    plain:
      zh: "在页面里给出可以核实的具体数据,可能让 AI 更愿意引用你"
      en: "Include verifiable, specific numbers on the page; AI may be more willing to cite you"
    verify:
      zh: "改完后等 2–4 周,用同一批问题再测一次,看「AI 有没有引用你的官网」这一格有没有从 🔴 变 🟡 或 🟢"
      en: "Wait 2–4 weeks, re-test with the same questions and see whether 'Does the AI cite your site' moves from 🔴 to 🟡 or 🟢"
    evidence_level: C
    sources:
      zh: [KDD2024(支持), C-SEO-Bench(削弱:跨域复测多数无效)]
      en: [KDD2024 (supports), C-SEO-Bench (weakens - mostly ineffective in cross-domain replication)]
    supported_intents: [category_discovery, recommendation, comparison_alternative]
    contraindications:
      zh: [页面已高密度统计, 数字无法溯源]
      en: [Pages already dense with statistics, Numbers that cannot be traced to sources]
    engines_tested: [benchmark_GE, perplexity]
    expected_effect: unknown_experiment_required
    guardrail:
      zh: 严禁生成虚假数字
      en: Fabricating numbers is strictly forbidden
    version: 1

  - id: EVIDENCE_QUOTABLE_V1
    stage: CITATION
    kind: geo_method
    hypothesis:
      zh: 提供清晰、可直接引述的结论句/定义句可能提高被引用概率
      en: Providing clear, directly quotable conclusion/definition sentences may increase citation probability
    plain:
      zh: "把结论写成清楚、可以直接引用的句子,可能让 AI 更愿意引用你"
      en: "Write conclusions as clear sentences that can be quoted directly; AI may be more willing to cite you"
    verify:
      zh: "改完后等 2–4 周,用同一批问题再测一次,看「AI 有没有引用你的官网」这一格有没有变好"
      en: "Wait 2–4 weeks, re-test with the same questions and see whether 'Does the AI cite your site' improves"
    evidence_level: C
    sources:
      zh: [KDD2024(引述类改写有正效应), C-SEO-Bench(多数改写基本无效)]
      en: [KDD2024 (quotation-style edits show positive effect), C-SEO-Bench (most rewrites largely ineffective)]
    supported_intents: [category_discovery, recommendation, comparison_alternative, problem_solution]
    contraindications:
      zh: [与正文主张不符的断言句]
      en: [Assertions inconsistent with the page's actual claims]
    engines_tested: [benchmark_GE]
    expected_effect: unknown_experiment_required
    guardrail:
      zh: 结论句必须有依据,禁止无来源断言
      en: Conclusion sentences must be grounded; unsourced assertions are forbidden
    version: 1

  - id: EVIDENCE_FAQ_V1
    stage: CITATION
    kind: geo_method
    hypothesis:
      zh: FAQ 化组织内容,在需求意图为问答式时可能利于被选为引用
      en: Organizing content as FAQs may help citation selection when the need intent is question-answering
    plain:
      zh: "当用户的问题本身就是问答式时,把内容整理成问答形式,可能更容易被 AI 选作来源"
      en: "When users' questions are Q&A-style, organizing content as Q&A may make it more likely to be picked as a source"
    verify:
      zh: "改完后等 2–4 周,用同一批问答式的问题再测一次,看「AI 有没有引用你的官网」这一格有没有变好"
      en: "Wait 2–4 weeks, re-test with the same Q&A-style questions and see whether 'Does the AI cite your site' improves"
    evidence_level: D
    sources:
      zh: [描述性关联,无对照研究]
      en: [Descriptive association; no controlled study]
    supported_intents: [category_discovery, recommendation, problem_solution]
    contraindications:
      zh: [与页面主题无关的 FAQ 堆砌]
      en: [Stuffing FAQs unrelated to the page topic]
    engines_tested: []
    expected_effect: unknown_experiment_required
    guardrail:
      zh: 仅意图匹配时采用
      en: Use only when the intent matches
    version: 1

  # ── REPRESENTATION ─────────────────────────────────────────────────
  - id: EVIDENCE_FACT_PAGE_V1
    stage: REPRESENTATION
    kind: geo_method
    hypothesis:
      zh: 官网维护清晰稳定的品牌事实陈述(定位/定价/差异点),便于模型正确描述品牌
      en: Maintaining clear, stable brand fact statements on the official site (positioning/pricing/differentiators) helps models describe the brand correctly
    plain:
      zh: "在官网维护一份清楚、稳定的品牌基本事实(定位、价格、与同类的差别),让 AI 介绍你时不出错"
      en: "Keep a clear, stable statement of brand basics on your site (positioning, pricing, how you differ) so AI describes you correctly"
    verify:
      zh: "改完后等 2–4 周,用「用户直接询问品牌时」的问题再测一次,看 AI 的介绍有没有变准确、评价有没有变好"
      en: "Wait 2–4 weeks, re-test with the 'when users ask about the brand directly' questions and see whether the AI's description becomes accurate and its tone improves"
    evidence_level: D
    sources:
      zh: [描述性关联]
      en: [Descriptive association]
    supported_intents: [brand_fact, category_discovery, recommendation]
    contraindications:
      zh: []
      en: []
    engines_tested: []
    expected_effect: unknown_experiment_required
    guardrail:
      zh: 事实陈述必须与现实一致并保持更新
      en: Fact statements must match reality and stay current
    version: 1

  - id: EVIDENCE_CORRECT_SOURCES_V1
    stage: REPRESENTATION
    kind: geo_method
    hypothesis:
      zh: 修正高被引第三方来源中的过时/错误信息,可能减少 AI 对品牌的错误描述
      en: Correcting outdated/incorrect information in highly-cited third-party sources may reduce AI misdescriptions of the brand
    plain:
      zh: "找到 AI 常引用的第三方页面里过时或错误的信息,请对方更正,减少 AI 说错你"
      en: "Find outdated or wrong information about you on the third-party pages AI cites most, and ask them to correct it"
    verify:
      zh: "对方更正后等 2–4 周再测一次,看 AI 的介绍里还有没有那条错误说法"
      en: "2–4 weeks after the source corrects it, re-test and check whether the wrong statement still appears in the AI's description"
    evidence_level: D
    sources:
      zh: [描述性关联(回答内容大量取材于被引第三方,本项目引用观测)]
      en: [Descriptive association (answers draw heavily on cited third parties; this project's citation observations)]
    supported_intents: [brand_fact, comparison_alternative]
    contraindications:
      zh: [无法联系的来源方]
      en: [Sources that cannot be contacted]
    engines_tested: [perplexity]
    expected_effect: unknown_experiment_required
    guardrail:
      zh: 只可请求事实性更正,禁止施压删除真实负面评价
      en: Only factual corrections may be requested; pressuring removal of genuine negative reviews is forbidden
    version: 1

  # ── 第三方线「引用」步(用户 2026-10-28 定「按建议进」;研究报告与来源明细:
  #    docs/研究/第三方线引用步-证据条目候选-2026-10-28.md;全部是 GEO 方法 → 实验卡)──────────
  - id: EVIDENCE_THIRDPARTY_CITED_PAGE_GAP_V1
    stage: CITATION
    channel: third_party   # 第三方线「搜到了写你的第三方网页,但 AI 没拿它们当参考」时出
    kind: geo_method   # 硬边界 9:一律实验卡
    hypothesis:
      zh: 被引用的网页几乎都来自 AI 自己检索到并排在前面的那一小撮;让 AI 回答这类问题时已经在引用的第三方网页也写到你,可能比另找新文章更容易让「别人提到你的文章」被当参考
      en: Cited pages come almost entirely from the small set the engine itself retrieves and ranks near the top; getting mentioned in the third-party pages the AI already cites for these questions may earn third-party citations more readily than seeking fresh coverage elsewhere
    plain:
      zh: "看看 AI 回答这类问题时已经在引用哪些别人写的文章(证据区有名单),争取让那些文章也写到你"
      en: "See which third-party articles the AI already cites for these questions (the evidence area lists them) and get those articles to mention you too"
    verify:
      zh: "对方加上你之后等 2–4 周,用同一批题、同一型号再测一次,看「AI 有没有拿别人提到你的文章当参考」这一格有没有从 🔴 变 🟡 或 🟢;另留一批没去争取的题做对照。一次只改一件事"
      en: "2–4 weeks after the page adds you, re-test the same questions on the same model and see whether 'Does the AI use articles about you as sources' moves from 🔴 to 🟡 or 🟢; keep a batch of untouched questions as a control. Change one thing at a time"
    evidence_level: C
    sources:
      zh: ["Chen & Koudas 2026(ChatGPT 引用的页面全部来自它自己的检索;检索解释 32% 差异、页面特征 2.8%;接口数据)", "Scrunch 2026-09(被引的第三方对比页写到品牌时推荐率 ~4%→~7%;准实验、厂商)", "Ahrefs 2026-07(老品牌新增的 AI 提及 94% 来自第三方页面;厂商实验)", "本项目实测观察(品类题第三方被引极少;描述性)"]
      en: ["Chen & Koudas 2026 (every ChatGPT citation was in its own retrieval; retrieval explains 32% of variance vs 2.8% for page features; API data)", "Scrunch 2026-09 (recommendation ~4%→~7% when a cited third-party comparison page names the brand; quasi-experiment, vendor)", "Ahrefs 2026-07 (94% of an established brand's new AI mentions came via third-party pages; vendor experiment)", "This project's field observation (third-party citations rare on category questions; descriptive)"]
    supported_intents: [category_discovery, recommendation, comparison_alternative, problem_solution]
    contraindications:
      zh: [证据区里 AI 这类题根本没引任何第三方网页(名单为空), 付费换提及且不披露, 要求对方改写评价(只可请求事实性补充或更正)]
      en: [The evidence area shows the AI cites no third-party pages at all for these questions (empty list), Paying for a mention without disclosure, Asking the page to rewrite its judgement (only factual additions or corrections may be requested)]
    engines_tested: [openai, gemini, perplexity, claude]
    expected_effect: unknown_experiment_required
    guardrail:
      zh: 只可通过真实的公关 / 内容合作请求收录;严禁付费不披露、严禁伪造第三方背书;被引页面名单只能从本次报告的证据区数出来,不得凭猜
      en: Only via genuine PR / content partnerships; undisclosed payment and fabricated endorsements are forbidden; the list of cited pages must come from this report's evidence area, never guessed
    version: 1

  - id: EVIDENCE_THIRDPARTY_LISTICLE_V1
    stage: CITATION
    channel: third_party
    kind: geo_method
    hypothesis:
      zh: 品类 / 推荐 / 对比类问题里,AI 引用的第三方网页以「最佳 X」榜单、对比文与测评为主,且第三方写的比品牌自建的更常带来推荐;被这类第三方文章收录,可能让「别人提到你的文章」被当参考
      en: For category / recommendation / comparison questions, the third-party pages AI cites are mostly "best X" lists, comparisons and reviews, and third-party lists lead to recommendations far more often than self-published ones; being included in such third-party articles may earn third-party citations
    plain:
      zh: "用户问「哪家好、怎么选」时,AI 多半引用别人写的榜单、对比和测评文;争取被这类文章收录——不是自己写一篇把自己排第一"
      en: "When users ask 'which is best / how to choose', AI mostly cites third-party lists, comparisons and reviews; get included in those — do not write your own list ranking yourself first"
    verify:
      zh: "文章收录你之后等 2–4 周,用同一批品类 / 推荐 / 对比题、同一型号再测一次,看「AI 有没有拿别人提到你的文章当参考」这一格有没有变好,以及那篇文章有没有出现在 AI 的来源里;另留一批没动的题做对照"
      en: "2–4 weeks after the article includes you, re-test the same category / recommendation / comparison questions on the same model; watch whether 'Does the AI use articles about you as sources' improves and whether that article appears among the AI's sources; keep untouched questions as a control"
    evidence_level: C
    sources:
      zh: ["Ahrefs 2025-12(750 个品类题,「最佳 X」榜单占被引页面类型 43.8%;厂商)", "Peec / Wix 2026-03(商业意图下榜单占引用 40.86%;专业服务前 1,000 被引榜单 80.9% 第三方、19.1% 自建;厂商)", "Scrunch 2026-09(中立第三方对比页带来推荐 Gemini 64.1% / ChatGPT 33.9%,自建榜单 14.8% / 8.6%;准实验、厂商)", "Seer 2026-02(反证:ChatGPT 榜单引用环比降 30%;代理)"]
      en: ["Ahrefs 2025-12 (750 category prompts; 'best X' lists = 43.8% of cited page types; vendor)", "Peec / Wix 2026-03 (listicles 40.86% of commercial-intent citations; professional-services top-1,000 cited lists 80.9% third-party vs 19.1% self-published; vendor)", "Scrunch 2026-09 (neutral third-party comparison pages lead to a recommendation in 64.1% Gemini / 33.9% ChatGPT vs 14.8% / 8.6% for self-ranked lists; quasi-experiment, vendor)", "Seer 2026-02 (counter: ChatGPT listicle citations fell 30% month over month; agency)"]
    supported_intents: [category_discovery, recommendation, comparison_alternative]
    contraindications:
      zh: [在自己网站上发「最佳 X」榜单把自己排第一(被引但不被推荐的反证), 付费上榜且不披露, 品牌事实类与问题方案类问题(不适用)]
      en: ["Publishing a 'best X' list on your own site ranking yourself first (counter-evidence: cited but not recommended)", Paid placement without disclosure, Brand-fact and problem-solution questions (not applicable)]
    engines_tested: [openai, gemini, perplexity, claude]
    expected_effect: unknown_experiment_required
    guardrail:
      zh: 只可通过真实测评 / 编辑收录;付费上榜必须披露且不得指定名次;严禁伪造榜单或测评
      en: Only via genuine reviews / editorial inclusion; paid placement must be disclosed and must not dictate rank; fabricated lists or reviews are forbidden
    version: 1

  - id: EVIDENCE_THIRDPARTY_PUBLISHER_V1
    stage: CITATION
    channel: third_party
    kind: geo_method
    hypothesis:
      zh: AI 选来源时看的是站点身份——它更常引用自己「认得」的媒体与评测站,通稿站与付费软文几乎不被引;被这类站点写到,可能比被不知名站点写到更容易让「别人提到你的文章」被当参考。「认得」不等于流量大或权重高
      en: Engines choose sources by site identity — they cite publishers the model already recognizes far more often, while PR-wire and paid advertorial pages are almost never cited; coverage on such outlets may earn third-party citations more readily than coverage on obscure sites. 'Recognized' is not the same as high-traffic or high-authority
    plain:
      zh: "被 AI 在你这个行业本来就常引用的媒体、评测站写到,比发通稿或被不知名站点写到更可能被当参考;哪些站算「常引用」,看报告证据区里数出来的名单,不要用网站权重猜"
      en: "Coverage on the media and review sites the AI already cites in your industry is more likely to be used as a source than press releases or obscure sites; which sites count is the list counted in the evidence area, not a guess from domain authority"
    verify:
      zh: "报道发布 2–4 周后,用同一批题、同一型号再测一次,看「AI 有没有拿别人提到你的文章当参考」这一格有没有变好,以及那家站有没有出现在 AI 的来源里;另留一批没动的题做对照"
      en: "2–4 weeks after the coverage is published, re-test the same questions on the same model; watch whether 'Does the AI use articles about you as sources' improves and whether that outlet appears among the AI's sources; keep untouched questions as a control"
    evidence_level: B
    sources:
      zh: ["Chen & Koudas 2026(ChatGPT 47% 的引用来自模型不搜也能叫出名字的站;接口数据)", "Dai 等 EMNLP 2025(控制实验:模型按媒体名字而非内容选来源;仿真)", "Yang 2025(36.6 万条引用:新闻引用高度集中在少数媒体;一手)", "Schuster 等 2026(模型偏好机构来源;仿真)", "Muck Rack 2026(2,500 万条引用:付费 / 软文 0.3%;厂商)", "Zhang 等 2025(反证:除 ChatGPT 外 AI 引用的域名按流量排名比谷歌低;一手)"]
      en: ["Chen & Koudas 2026 (47% of ChatGPT citations come from sites the model names without searching; API data)", "Dai et al. EMNLP 2025 (controlled experiments: models pick sources by outlet name, not content; simulation)", "Yang 2025 (366k citations: news citations concentrate heavily among few outlets; primary)", "Schuster et al. 2026 (models prefer institutional sources; simulation)", "Muck Rack 2026 (25M cited links: paid / advertorial 0.3%; vendor)", "Zhang et al. 2025 (counter: except ChatGPT, engines cite less-popular domains by traffic rank than Google; primary)"]
    supported_intents: [category_discovery, recommendation, comparison_alternative, problem_solution, brand_fact]
    contraindications:
      zh: [发通稿到通稿站(几乎不被引), 付费软文不披露, 证据区里 AI 在这类题上常引用的站没有一家覆盖你的品类]
      en: [Press releases on wire services (almost never cited), Undisclosed paid advertorial, None of the outlets the AI cites for these questions covers your category at all]
    engines_tested: [openai, gemini, perplexity]
    expected_effect: unknown_experiment_required
    guardrail:
      zh: 「AI 认得的站」只能从本次报告的证据区数出来,不得凭 DR / 流量 / 名气猜;只可争取真实报道与测评,严禁付费不披露
      en: Which outlets 'the AI recognizes' must be counted from this report's evidence area, never guessed from DR / traffic / fame; only genuine coverage and reviews, undisclosed payment forbidden
    version: 1

  - id: EVIDENCE_THIRDPARTY_REVIEW_PROFILE_V1
    stage: CITATION
    channel: third_party
    kind: geo_method
    hypothesis:
      zh: 在 AI 常引用的第三方评价平台(软件类如 G2 / Capterra,消费与本地服务类如 Trustpilot / Yelp,视行业而定)上有真实、活跃的档案,与「别人提到你的文章」被引用相关;方向与幅度都没有对照实验
      en: Having a genuine, active profile on the third-party review platforms the AI cites (G2 / Capterra for software, Trustpilot / Yelp for consumer and local services, depending on the industry) correlates with third-party citations; neither direction nor size has been tested with a control
    plain:
      zh: "在你这个行业 AI 常引用的评价平台上有真实、活跃的页面(有真实用户的评价),可能更容易被 AI 当参考;这只是相关,不是证明"
      en: "Having a genuine, active page with real customer reviews on the review platforms the AI cites in your industry may make it more likely to be used as a source; this is a correlation, not proof"
    verify:
      zh: "档案建好、有真实评价后等 4–8 周,用同一批题、同一型号再测一次,看「AI 有没有拿别人提到你的文章当参考」这一格有没有变好,以及那个平台有没有出现在 AI 的来源里;另留一批没动的题做对照"
      en: "4–8 weeks after the profile is live with genuine reviews, re-test the same questions on the same model; watch whether 'Does the AI use articles about you as sources' improves and whether that platform appears among the AI's sources; keep untouched questions as a control"
    evidence_level: D
    sources:
      zh: ["Seer / Trustpilot 2026-05(804,491 条回答、1,926 品牌、按 DR 配对:无档案中位引用率 1%,1–13 条评价 53.5%;横截面,Trustpilot 推广)", "G2 / Indig 2025-10(反证:评价数 +10% ≈ 引用 +2%,R² 0.009;平台自发)", "Profound 2025-06(G2 占 ChatGPT 引用 1.1%,Perplexity 前十含 G2 / Yelp / TripAdvisor;厂商)", "Peec 2026-03(G2 只进 Perplexity 前五;厂商)"]
      en: ["Seer / Trustpilot 2026-05 (804,491 responses, 1,926 brands, DR-matched: median citation rate 1% with no profile vs 53.5% with 1–13 reviews; cross-sectional, promoted by Trustpilot)", "G2 / Indig 2025-10 (counter: +10% reviews ≈ +2% citations, R² 0.009; platform-published)", "Profound 2025-06 (G2 = 1.1% of ChatGPT citations; Perplexity top-10 includes G2 / Yelp / TripAdvisor; vendor)", "Peec 2026-03 (G2 only in Perplexity's top 5; vendor)"]
    supported_intents: [recommendation, comparison_alternative, category_discovery, brand_fact]
    contraindications:
      zh: [刷评 / 付费评 / 激励评 / 只邀请满意客户评价(FTC 2024 规则与各平台准则禁止), 证据区里 AI 在这类题上没引过任何评价平台, 把软件评价平台的结论套到消费品牌(平台不同)]
      en: [Fake / paid / incentivised / cherry-picked reviews (forbidden by the FTC 2024 rule and platform guidelines), The evidence area shows the AI never cites review platforms for these questions, Applying software-review findings to consumer brands (different platforms)]
    engines_tested: [openai, gemini, perplexity]
    expected_effect: unknown_experiment_required
    guardrail:
      zh: 只可按平台规则邀请真实客户评价;严禁激励、筛选、冒充;不得因负面评价施压删除
      en: Only invite genuine customers under the platform's rules; incentives, gating and impersonation are forbidden; never pressure for removal of negative reviews
    version: 1

