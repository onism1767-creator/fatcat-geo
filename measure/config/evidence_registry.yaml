# 证据注册表(架构书第 8 章)。人工维护的配置资产,不是代码。
#
# 运行规则:
# - 报告中每条建议必须引用本表条目 ID;表里没有的建议不允许出现(铁律 9);
# - evidence_level:A=官方文档/强共识 B=多研究支持 C=单一研究且有反证
#   D=描述性关联 E=无支持(E 级永不作为建议输出,仅存档);
# - C 级及以下的建议渲染时必须带「建议实验验证」字样;
# - 吸收新研究 = 增改本表条目,零代码改动;
# - v1.1 起展示字段(hypothesis/guardrail/contraindications/sources)为 zh/en 双语;
# - v0.4.14 起每条带 plain(人话版,只换说法不换主张):用户视图读 plain,
#   「为什么这么建议」与审计视图读 hypothesis 原句;
# - v0.4.17 起每条带 verify(做完之后怎么检查效果,人话),报告建议表第二列。
#
# 主要来源:KDD2024(arXiv:2311.09735)、C-SEO-Bench(arXiv:2506.11097)、
# SAGEO-Arena(arXiv:2602.12187)、各平台官方爬虫文档。详见架构书 5.3。

entries:
  # ── ACCESS ──────────────────────────────────────────────────────────
  - id: EVIDENCE_ACCESS_ROBOTS_V1
    stage: ACCESS
    access_checks: [robots_txt]  # 只在这几项检查 FAIL 时给出(审核 2026-10-27 黄 14)
    hypothesis:
      zh: 在 robots.txt 中放行检索类与用户触发类 AI 爬虫,是进入 AI 检索链路的前提
      en: Allowing retrieval and user-triggered AI crawlers in robots.txt is a precondition for entering AI retrieval pipelines
    plain:
      zh: "在 robots.txt 里允许 AI 搜索类爬虫访问你的网站,这是 AI 能找到你的前提"
      en: "Allow AI search crawlers in your robots.txt — without it, AI search cannot reach your site at all"
    verify:
      zh: "改完后重新检测一次,看「官网抓取情况」有没有变成 🟢;真正确认要看网站后台或日志里官方 AI 爬虫是否访问成功"
      en: "Re-run the check and see whether 'Site crawlability' turns 🟢; the real confirmation is whether official AI crawlers succeed in your server logs"
    evidence_level: A
    sources:
      zh: [各平台官方爬虫文档]
      en: [Official crawler documentation of each platform]
    supported_intents: [category_discovery, recommendation, comparison_alternative, problem_solution, brand_fact]
    contraindications:
      zh: [内容策略上有意屏蔽 AI 使用的站点]
      en: [Sites that deliberately block AI use as a content policy]
    engines_tested: [官方文档口径]
    expected_effect: 必要非充分条件
    guardrail:
      zh: 放行只解决准入,不构成任何排名或引用承诺
      en: Allowing access only solves admission; it promises no ranking or citations
    version: 1

  - id: EVIDENCE_ACCESS_CDN_VERIFY_V1
    stage: ACCESS
    access_checks: [reachability, path_fetch, ua_differential, waf_evidence]
    hypothesis:
      zh: CDN/WAF 侧按官方 IP 段核验放行真实爬虫,而非按 UA 一刀切封禁
      en: Verify real crawlers by official IP ranges at the CDN/WAF instead of blanket UA blocking
    plain:
      zh: "让网站的安全系统(CDN / 防火墙)按官方 IP 名单放行真实的 AI 爬虫,而不是一刀切拦掉所有机器人"
      en: "Have your CDN / firewall admit real AI crawlers by their official IP lists instead of blocking every bot"
    verify:
      zh: "在 CDN 后台确认官方爬虫的访问不再被拦,再重新检测一次看「官网抓取情况」"
      en: "Confirm in the CDN console that official crawlers are no longer blocked, then re-run the check and look at 'Site crawlability'"
    evidence_level: A
    sources:
      zh: [各平台官方 IP 段文档, 主流 CDN verified-bots 机制文档]
      en: [Official crawler IP-range docs, mainstream CDN verified-bots documentation]
    supported_intents: [category_discovery, recommendation, comparison_alternative, problem_solution, brand_fact]
    contraindications:
      zh: []
      en: []
    engines_tested: [官方文档口径]
    expected_effect: 消除准入层阻断
    guardrail:
      zh: 需在 CDN 后台核验,本工具的 UA 探测无法替代站长侧确认
      en: Verify in the CDN console; this tool's UA probing cannot replace site-owner confirmation
    version: 1

  - id: EVIDENCE_ACCESS_SSR_V1
    stage: ACCESS
    access_checks: [html_content, rendered_fetch]
    hypothesis:
      zh: 关键内容以服务端渲染/预渲染提供,不依赖客户端 JS 执行
      en: Serve key content via server-side rendering / prerendering rather than client-side JS
    plain:
      zh: "把关键内容直接放在网页 HTML 里,不要只靠浏览器脚本加载,因为多数 AI 爬虫不运行脚本"
      en: "Put key content directly in the page HTML rather than loading it with browser scripts — most AI crawlers do not run scripts"
    verify:
      zh: "用不运行脚本的方式打开页面(比如查看网页源代码),确认正文在里面;再重新检测看「官网抓取情况」"
      en: "Open the page without scripts (e.g. view page source) and confirm the text is there; then re-run the check and look at 'Site crawlability'"
    evidence_level: A
    sources:
      zh: [各平台官方爬虫文档(主流 AI 爬虫不执行 JS)]
      en: [Official crawler docs (mainstream AI crawlers do not execute JS)]
    supported_intents: [category_discovery, recommendation, comparison_alternative, problem_solution, brand_fact]
    contraindications:
      zh: []
      en: []
    engines_tested: [官方文档口径]
    expected_effect: 使正文对不执行 JS 的爬虫可读
    guardrail:
      zh: 对爬虫与对用户的内容必须一致,禁止差异化伪装
      en: Content served to crawlers must match what users see; cloaking is forbidden
    version: 1

  - id: EVIDENCE_ACCESS_SITEMAP_V1
    stage: ACCESS
    access_checks: [sitemap]
    hypothesis:
      zh: 提供 sitemap 与规范链接可能有助于收录完整性
      en: Providing a sitemap and canonical links may help indexing completeness
    plain:
      zh: "提供网站地图(sitemap)和规范链接,可能帮助 AI 更完整地收录你的页面"
      en: "Provide a sitemap and canonical links; this may help AI index your pages more completely"
    verify:
      zh: "提交后过两周重新检测;这一项只是提示,变化不一定看得出来"
      en: "Re-run the check two weeks after submitting; this item is informational and a change may not be visible"
    evidence_level: D
    sources:
      zh: [传统搜索引擎收录实践的描述性外推]
      en: [Descriptive extrapolation from traditional search-engine indexing practice]
    supported_intents: [category_discovery, recommendation, comparison_alternative, problem_solution, brand_fact]
    contraindications:
      zh: []
      en: []
    engines_tested: []
    expected_effect: unknown_experiment_required
    guardrail:
      zh: 不阻断准入,属提示项
      en: Not an access blocker; informational
    version: 1

  # ── RETRIEVAL ───────────────────────────────────────────────────────
  - id: EVIDENCE_STRUCT_V1
    stage: RETRIEVAL
    hypothesis:
      zh: 标题/heading/schema 等结构信号与目标需求语义对齐,有利于检索阶段存活
      en: Aligning structural signals (title/headings/schema) with the target need helps survival at the retrieval stage
    plain:
      zh: "让页面标题、小标题和结构化标记直接说明这页回答的是什么问题,AI 搜索时更容易把它挑出来"
      en: "Make page titles, headings and structured markup say plainly which question the page answers, so AI search can pick it out"
    verify:
      zh: "改完后等 2–4 周,用同一批问题再测一次,看「AI 搜索时有没有找到你」这一格有没有从 🔴 变 🟡 或 🟢;一次只改一件事再测,才知道是哪个起了作用"
      en: "Wait 2–4 weeks, re-test with the same questions and see whether 'Does the AI find you when it searches' moves from 🔴 to 🟡 or 🟢; change one thing at a time so you know what worked"
    evidence_level: B
    sources:
      zh: [SAGEO-Arena(支持:结构化信息利于检索), C-SEO-Bench(检索位次效应显著)]
      en: ["SAGEO-Arena (supports: structured signals help retrieval)", "C-SEO-Bench (strong retrieval-position effect)"]
    supported_intents: [category_discovery, recommendation, comparison_alternative, problem_solution]
    contraindications:
      zh: [已高度优化的页面继续堆砌, 与页面真实内容不符的标题]
      en: [Further stuffing already-optimized pages, Titles inconsistent with actual page content]
    engines_tested: [benchmark_GE, 完整检索流水线仿真]
    expected_effect: 检索阶段存活率提升(幅度须实验)
    guardrail:
      zh: 只改结构与语义对齐,严禁关键词堆砌(有负效应反证)
      en: Only adjust structure and semantic alignment; keyword stuffing is forbidden (counter-evidence of negative effects)
    version: 1

  - id: EVIDENCE_COVERAGE_PAGE_V1
    stage: RETRIEVAL
    hypothesis:
      zh: 为目标需求创建直接作答的专门页面(提高语义覆盖)可能改善进入候选的概率
      en: Creating dedicated pages that directly answer the target need (better semantic coverage) may improve candidate entry
    plain:
      zh: "为用户真正会问的问题写专门的页面、直接作答,让 AI 搜索时更容易找到你"
      en: "Write dedicated pages that directly answer the questions users actually ask, so AI search is more likely to find you"
    verify:
      zh: "新页面上线 2–4 周后,用同一批问题再测一次,看「AI 搜索时有没有找到你」这一格有没有变好"
      en: "2–4 weeks after the new pages go live, re-test with the same questions and see whether 'Does the AI find you when it searches' improves"
    evidence_level: C
    sources:
      zh: [SAGEO-Arena(间接支持), 传统检索共识(描述性)]
      en: [SAGEO-Arena (indirect support), Traditional IR consensus (descriptive)]
    supported_intents: [category_discovery, recommendation, problem_solution]
    contraindications:
      zh: [大量薄内容页面]
      en: [Mass-producing thin-content pages]
    engines_tested: [benchmark_GE]
    expected_effect: unknown_experiment_required
    guardrail:
      zh: 页面须真实有料,禁止批量生成空壳页
      en: Pages must have real substance; bulk-generating empty shells is forbidden
    version: 1

  - id: EVIDENCE_THIRDPARTY_RETRIEVAL_V1
    stage: RETRIEVAL
    channel: third_party   # 第三方线「搜不到写你的第三方网页」时出(架构书附录 v0.4.24 D9;S6.1 从官网线挪来)
    hypothesis:
      zh: 进入检索存在感高的第三方内容(测评/榜单/对比文)可为品牌获得检索层在场
      en: Getting covered by third-party content with strong retrieval presence (reviews/rankings/comparisons) can earn retrieval-stage presence
    plain:
      zh: "争取出现在 AI 常引用的第三方内容里(测评、榜单、对比文章),借它们进入 AI 的搜索结果"
      en: "Get covered by the third-party content AI tends to cite (reviews, rankings, comparisons) and enter AI search results through them"
    verify:
      zh: "第三方内容发布 2–4 周后,用同一批问题再测一次,看「AI 搜索时有没有找到你」这一格,以及 AI 引用的来源里有没有出现那些第三方页面"
      en: "2–4 weeks after the third-party content is published, re-test with the same questions; watch 'Does the AI find you when it searches' and whether those third-party pages appear among the AI's sources"
    evidence_level: C
    sources:
      zh: [本项目实测观察(检索候选集由第三方内容主导,描述性), C-SEO-Bench(来源位次效应)]
      en: [This project's field observation (candidate sets dominated by third-party content; descriptive), C-SEO-Bench (source-position effect)]
    supported_intents: [category_discovery, recommendation, comparison_alternative]
    contraindications:
      zh: [伪造第三方背书(黑帽,禁止)]
      en: [Faking third-party endorsements (black-hat; forbidden)]
    engines_tested: [perplexity]
    expected_effect: unknown_experiment_required
    guardrail:
      zh: 只可通过真实的公关/内容合作达成,严禁伪造与刷量
      en: Only via genuine PR/content partnerships; fabrication and volume manipulation are forbidden
    version: 1

  # ── CITATION ────────────────────────────────────────────────────────
  - id: EVIDENCE_STATS_V1
    stage: CITATION
    hypothesis:
      zh: 增加可核验的量化证据可能提高生成阶段被引用概率
      en: Adding verifiable quantitative evidence may increase citation probability at the generation stage
    plain:
      zh: "在页面里给出可以核实的具体数据,可能让 AI 更愿意引用你"
      en: "Include verifiable, specific numbers on the page; AI may be more willing to cite you"
    verify:
      zh: "改完后等 2–4 周,用同一批问题再测一次,看「AI 有没有引用你的官网」这一格有没有从 🔴 变 🟡 或 🟢"
      en: "Wait 2–4 weeks, re-test with the same questions and see whether 'Does the AI cite your site' moves from 🔴 to 🟡 or 🟢"
    evidence_level: C
    sources:
      zh: [KDD2024(支持), C-SEO-Bench(削弱:跨域复测多数无效)]
      en: [KDD2024 (supports), C-SEO-Bench (weakens - mostly ineffective in cross-domain replication)]
    supported_intents: [category_discovery, recommendation, comparison_alternative]
    contraindications:
      zh: [页面已高密度统计, 数字无法溯源]
      en: [Pages already dense with statistics, Numbers that cannot be traced to sources]
    engines_tested: [benchmark_GE, perplexity]
    expected_effect: unknown_experiment_required
    guardrail:
      zh: 严禁生成虚假数字
      en: Fabricating numbers is strictly forbidden
    version: 1

  - id: EVIDENCE_QUOTABLE_V1
    stage: CITATION
    hypothesis:
      zh: 提供清晰、可直接引述的结论句/定义句可能提高被引用概率
      en: Providing clear, directly quotable conclusion/definition sentences may increase citation probability
    plain:
      zh: "把结论写成清楚、可以直接引用的句子,可能让 AI 更愿意引用你"
      en: "Write conclusions as clear sentences that can be quoted directly; AI may be more willing to cite you"
    verify:
      zh: "改完后等 2–4 周,用同一批问题再测一次,看「AI 有没有引用你的官网」这一格有没有变好"
      en: "Wait 2–4 weeks, re-test with the same questions and see whether 'Does the AI cite your site' improves"
    evidence_level: C
    sources:
      zh: [KDD2024(引述类改写有正效应), C-SEO-Bench(多数改写基本无效)]
      en: [KDD2024 (quotation-style edits show positive effect), C-SEO-Bench (most rewrites largely ineffective)]
    supported_intents: [category_discovery, recommendation, comparison_alternative, problem_solution]
    contraindications:
      zh: [与正文主张不符的断言句]
      en: [Assertions inconsistent with the page's actual claims]
    engines_tested: [benchmark_GE]
    expected_effect: unknown_experiment_required
    guardrail:
      zh: 结论句必须有依据,禁止无来源断言
      en: Conclusion sentences must be grounded; unsourced assertions are forbidden
    version: 1

  - id: EVIDENCE_FAQ_V1
    stage: CITATION
    hypothesis:
      zh: FAQ 化组织内容,在需求意图为问答式时可能利于被选为引用
      en: Organizing content as FAQs may help citation selection when the need intent is question-answering
    plain:
      zh: "当用户的问题本身就是问答式时,把内容整理成问答形式,可能更容易被 AI 选作来源"
      en: "When users' questions are Q&A-style, organizing content as Q&A may make it more likely to be picked as a source"
    verify:
      zh: "改完后等 2–4 周,用同一批问答式的问题再测一次,看「AI 有没有引用你的官网」这一格有没有变好"
      en: "Wait 2–4 weeks, re-test with the same Q&A-style questions and see whether 'Does the AI cite your site' improves"
    evidence_level: D
    sources:
      zh: [描述性关联,无对照研究]
      en: [Descriptive association; no controlled study]
    supported_intents: [category_discovery, recommendation, problem_solution]
    contraindications:
      zh: [与页面主题无关的 FAQ 堆砌]
      en: [Stuffing FAQs unrelated to the page topic]
    engines_tested: []
    expected_effect: unknown_experiment_required
    guardrail:
      zh: 仅意图匹配时采用
      en: Use only when the intent matches
    version: 1

  # ── REPRESENTATION ─────────────────────────────────────────────────
  - id: EVIDENCE_FACT_PAGE_V1
    stage: REPRESENTATION
    hypothesis:
      zh: 官网维护清晰稳定的品牌事实陈述(定位/定价/差异点),便于模型正确描述品牌
      en: Maintaining clear, stable brand fact statements on the official site (positioning/pricing/differentiators) helps models describe the brand correctly
    plain:
      zh: "在官网维护一份清楚、稳定的品牌基本事实(定位、价格、与同类的差别),让 AI 介绍你时不出错"
      en: "Keep a clear, stable statement of brand basics on your site (positioning, pricing, how you differ) so AI describes you correctly"
    verify:
      zh: "改完后等 2–4 周,用「用户直接询问品牌时」的问题再测一次,看 AI 的介绍有没有变准确、评价有没有变好"
      en: "Wait 2–4 weeks, re-test with the 'when users ask about the brand directly' questions and see whether the AI's description becomes accurate and its tone improves"
    evidence_level: D
    sources:
      zh: [描述性关联]
      en: [Descriptive association]
    supported_intents: [brand_fact, category_discovery, recommendation]
    contraindications:
      zh: []
      en: []
    engines_tested: []
    expected_effect: unknown_experiment_required
    guardrail:
      zh: 事实陈述必须与现实一致并保持更新
      en: Fact statements must match reality and stay current
    version: 1

  - id: EVIDENCE_CORRECT_SOURCES_V1
    stage: REPRESENTATION
    hypothesis:
      zh: 修正高被引第三方来源中的过时/错误信息,可能减少 AI 对品牌的错误描述
      en: Correcting outdated/incorrect information in highly-cited third-party sources may reduce AI misdescriptions of the brand
    plain:
      zh: "找到 AI 常引用的第三方页面里过时或错误的信息,请对方更正,减少 AI 说错你"
      en: "Find outdated or wrong information about you on the third-party pages AI cites most, and ask them to correct it"
    verify:
      zh: "对方更正后等 2–4 周再测一次,看 AI 的介绍里还有没有那条错误说法"
      en: "2–4 weeks after the source corrects it, re-test and check whether the wrong statement still appears in the AI's description"
    evidence_level: D
    sources:
      zh: [描述性关联(回答内容大量取材于被引第三方,本项目引用观测)]
      en: [Descriptive association (answers draw heavily on cited third parties; this project's citation observations)]
    supported_intents: [brand_fact, comparison_alternative]
    contraindications:
      zh: [无法联系的来源方]
      en: [Sources that cannot be contacted]
    engines_tested: [perplexity]
    expected_effect: unknown_experiment_required
    guardrail:
      zh: 只可请求事实性更正,禁止施压删除真实负面评价
      en: Only factual corrections may be requested; pressuring removal of genuine negative reviews is forbidden
    version: 1

  # ── E 级存档(永不作为建议输出)──────────────────────────────────────
  - id: EVIDENCE_LLMSTXT_V1
    stage: RETRIEVAL
    hypothesis:
      zh: 部署 llms.txt 能改善 AI 可见度
      en: Deploying llms.txt improves AI visibility
    plain:
      zh: "部署 llms.txt 文件能改善 AI 可见度(没有证据,不作为建议)"
      en: "Deploying an llms.txt file improves AI visibility (no evidence; never recommended)"
    verify:
      zh: "不适用(不作为建议)"
      en: "Not applicable (never recommended)"
    evidence_level: E
    sources:
      zh: [无平台确认采用的证据]
      en: [No evidence of platform adoption]
    supported_intents: []
    contraindications:
      zh: []
      en: []
    engines_tested: []
    expected_effect: 无证据
    guardrail:
      zh: 不作为建议输出
      en: Never emitted as a recommendation
    version: 1

  - id: EVIDENCE_KEYWORD_STUFFING_V1
    stage: RETRIEVAL
    hypothesis:
      zh: 关键词堆砌能提升 AI 检索可见度
      en: Keyword stuffing improves AI retrieval visibility
    plain:
      zh: "在页面里堆砌关键词能提升 AI 搜索可见度(反证:会全面变差,禁止)"
      en: "Stuffing keywords into pages improves AI search visibility (counter-evidence: makes things worse; forbidden)"
    verify:
      zh: "不适用(禁止项)"
      en: "Not applicable (forbidden)"
    evidence_level: E
    sources:
      zh: [SAGEO-Arena(反证:仅优化正文使检索/重排/引用全面下降)]
      en: [SAGEO-Arena (counter-evidence - body-only optimization degrades retrieval/rerank/citation across the board)]
    supported_intents: []
    contraindications:
      zh: []
      en: []
    engines_tested: [完整检索流水线仿真]
    expected_effect: 负效应
    guardrail:
      zh: 禁止项,任何情况下不得建议
      en: Forbidden; must never be recommended
    version: 1
