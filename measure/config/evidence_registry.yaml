  - id: EVIDENCE_THIRDPARTY_PAID_PLACEMENT_V1
    stage: CITATION
    channel: third_party
    kind: geo_method   # E 级存档,永不作为建议输出(kind 只有 technical_fix / geo_method 两个值,与现有 KEYWORD_STUFFING 同)
    hypothesis:
      zh: 买第三方提及、付费上榜不披露、马甲 / 代写回帖、刷评、付费改维基、在页面藏指令,能提高「别人提到你的文章」被引用
      en: Buying third-party mentions, undisclosed paid listings, sockpuppet / ghost-written replies, fake reviews, paid Wikipedia edits or hidden instructions on pages raise third-party citations
    plain:
      zh: "花钱买提及、买榜单位置、用马甲发帖、刷评价、付费改维基百科来让 AI 引用你(违规,禁止;效果也站不住)"
      en: "Buying mentions, list placements, sockpuppet posts, fake reviews or paid Wikipedia edits to get cited by AI (rule-breaking, forbidden; effects do not hold either)"
    verify:
      zh: "不适用(禁止项)"
      en: "Not applicable (forbidden)"
    evidence_level: E
    sources:
      zh: ["Muck Rack 2026(付费 / 软文占引用 0.3%;厂商)", "Sitebulb / Shotland 2026-02(买账号刷提及,停即归零;二手)", "404 Media 2024-04(卖 AI 代写 Reddit 回帖的账号多被封)", "Nestaas 等 2024 / Pfrommer 等 2024(网页藏指令可操纵 AI 推荐;一手 / 仿真)", "FTC 2024-08 规则、Google 站点声誉政策 2026-08、Reddit 内容政策第 2 条、维基百科付费编辑披露政策、Bing 站长指南(操纵语言模型内容降权)"]
      en: ["Muck Rack 2026 (paid / advertorial = 0.3% of citations; vendor)", "Sitebulb / Shotland 2026-02 (purchased accounts; gains vanished when stopped; secondary)", "404 Media 2024-04 (accounts selling AI-written Reddit replies mostly banned)", "Nestaas et al. 2024 / Pfrommer et al. 2024 (hidden page instructions manipulate AI recommendations; primary / simulation)", "FTC rule 2024-08, Google site reputation policy 2026-08, Reddit Content Policy rule 2, Wikipedia paid-contribution disclosure, Bing Webmaster Guidelines (manipulating language models reduces visibility)"]
    supported_intents: []
    contraindications:
      zh: []
      en: []
    engines_tested: []
    expected_effect: 违规;效果不持久
    guardrail:
      zh: 禁止项,任何情况下不得建议
      en: Forbidden; must never be recommended
    version: 1
