# 各部分在这个仓库里的位置,相对本文件所在的文件夹。
# python 是跑它用的解释器(相对该部分的文件夹);各部分共用仓库根的那一个环境(uv sync --all-packages)。
# url 是它的本机网页地址。

[modules.toast]
role = "measure: ask the AIs, judge the answers, diagnose"
path = "measure"
python = "../.venv/Scripts/python.exe"
url = "http://127.0.0.1:8600"

[modules.butter]
role = "improve: read the site, check content, prepare changes, compare before and after"
path = "improve"
python = "../.venv/Scripts/python.exe"
