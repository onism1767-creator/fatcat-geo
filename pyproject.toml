[project]
name = "fatcat-geo"
version = "0.0.1"
description = "FatCat GEO Full Toolkit: one entry point over Measure, Diagnose and Improve."
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.111",
    "httpx>=0.27",
    "python-dotenv>=1.0",
    "python-multipart>=0.0.9",
    "PyYAML>=6",  # 读 Butter 的配置表
    "uvicorn>=0.30",
]

[dependency-groups]
dev = ["pytest>=8"]

[project.scripts]
fatcat = "fatcat.cli:main"

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["fatcat*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
