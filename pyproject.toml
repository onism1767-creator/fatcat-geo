[project]
name = "fatcat-geo"
version = "0.1.1"
description = "FatCat GEO Full Toolkit: one entry point over Measure, Diagnose and Improve."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.111",
    "httpx>=0.27",
    "python-dotenv>=1.0",
    "python-multipart>=0.0.9",
    "PyYAML>=6",  # 读 Butter 的配置表
    "uvicorn>=0.30",
]

[dependency-groups]
dev = [
    "pytest>=8",
    "ruff>=0.16",
]

[project.scripts]
fatcat = "fatcat.cli:main"

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["fatcat*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 120
target-version = "py312"
# 并进来的几部分各有各的格式规矩(各自的 pyproject),根目录的检查不管它们
extend-exclude = ["measure", "improve", "legacy"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
# B008:FastAPI 的 File(...)、Form(...) 就是写在参数默认值里的。
# E501:中文字符按两格算,一行中文注释或界面文字很容易超 120;行宽靠人看,不让它挡检查。
ignore = ["B008", "E501"]

# 一份锁文件、一条命令装完:uv sync --all-packages
[tool.uv.workspace]
members = ["measure", "improve"]
