# 每次推送和合并请求都跑一遍。全程离线:不调用任何收费的 AI 接口。
# 型号核对、证据表核对要另外三个项目在旁边,仓库并好之前只在本机跑(scripts/check.py)。

name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # 查 key 要看全部提交历史

      - uses: astral-sh/setup-uv@v6

      - name: 安装
        run: uv sync --locked

      - name: 格式、测试、查 key 泄露
        run: uv run python scripts/check.py --quick
